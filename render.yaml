services:
  - type: web
    name: apiforge
    env: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: APIForge
      - key: APP_URL
        value: https://apiforge.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: SCRAPER_API_KEY
        value: apiforge-prod-key-2025
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error

  - type: cron
    name: blog-scraper
    env: python
    buildCommand: pip install -r scraper/requirements.txt
    schedule: "0 6 * * *"
    startCommand: python scraper/blog_scraper.py
    envVars:
      - key: APIFORGE_API_KEY
        value: apiforge-prod-key-2025
      - key: APIFORGE_BLOG_WEBHOOK
        value: https://apiforge.onrender.com/api/blog-posts

  - type: cron
    name: price-scraper
    env: python
    buildCommand: pip install -r scraper/requirements.txt
    schedule: "0 3 * * 0"
    startCommand: python scraper/scraper.py
    envVars:
      - key: APIFORGE_API_KEY
        value: apiforge-prod-key-2025
      - key: APIFORGE_WEBHOOK_URL
        value: https://apiforge.onrender.com/api/update-prices
